<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be F3F</title>
    <style>
        :root {
            --primary: #1b365d;
            --primary-hover: #122540;
            --accent: #c0392b;
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #6c7a89;
            --border-color: #dce1e5;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px 20px; 
            line-height: 1.5;
        }

        .container { 
            max-width: 1140px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            border-top: 5px solid var(--primary);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .brand-container {
            text-align: left;
        }

        .brand-title { 
            font-size: 34px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #1b365d 0%, #2980b9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 4px 0; 
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 0;
            font-weight: 500;
        }

        /* Menu Burger (3 traits) */
        .menu-container {
            position: relative;
        }

        .hamburger-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 40px;
            height: 38px;
            transition: background 0.2s;
        }

        .hamburger-btn:hover {
            background: #edf2f7;
        }

        .hamburger-line {
            width: 100%;
            height: 3px;
            background-color: var(--primary);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* Menu déroulant */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            min-width: 260px;
            z-index: 100;
            overflow: hidden;
            animation: fadeIn 0.15s ease-out;
        }

        .dropdown-menu.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            background: #f8fafc;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        .menu-item {
            padding: 10px 16px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.15s, color 0.15s;
            display: block;
            text-align: left;
            width: 100%;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: #f0f4f8;
            color: var(--primary);
        }

        .menu-item.active {
            background: #eef2f7;
            color: var(--primary);
            font-weight: 600;
        }
        
        .upload-area { 
            border: 2px dashed var(--border-color); 
            border-radius: 6px; 
            padding: 25px; 
            text-align: center; 
            background: #fafbfc; 
            margin: 15px 0 25px 0; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .upload-area:hover { 
            border-color: var(--primary); 
            background: #f0f4f8; 
        }
        .upload-area h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: var(--primary);
        }
        .upload-area p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        input[type="file"] { display: none; }

        .controls-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f8fafc; 
            padding: 12px 18px; 
            border: 1px solid var(--border-color);
            border-radius: 6px; 
            margin-top: 10px; 
            flex-wrap: wrap; 
            gap: 15px; 
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select { 
            padding: 6px 12px; 
            font-size: 14px; 
            border-radius: 4px; 
            border: 1px solid var(--border-color); 
            background: white;
            color: var(--text-main);
            font-weight: 500; 
        }
        
        button.action-btn {
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-excel { background: #107c41; color: white; }
        .btn-excel:hover { background: #0b5329; }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-danger { background: var(--accent); color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-danger:hover { background: #a93226; }

        .tab-content { display: none; padding-top: 20px; }
        .tab-content.active { display: block; }

        h2 {
            font-size: 18px;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13.5px; }
        th, td { padding: 10px 14px; border: 1px solid var(--border-color); text-align: left; }
        th { background-color: #f8fafc; color: #334155; font-weight: 600; }
        tr:nth-child(even) { background-color: #fbfbfc; }
        .highlight { font-weight: 600; color: var(--accent); }
        .nc-row { color: #94a3b8; font-style: italic; background-color: #ffffff !important; }
        .status-msg { font-weight: 500; margin-bottom: 15px; text-align: center; font-size: 14px; color: var(--primary); }
        .scrollable-table { max-height: 500px; overflow-y: auto; display: block; border: 1px solid var(--border-color); border-radius: 4px; }

        /* Profils et SVG */
        .pilot-link { color: #0066cc; cursor: pointer; text-decoration: none; font-weight: 500; }
        .pilot-link:hover { text-decoration: underline; }
        .profile-container { display: flex; flex-wrap: wrap; gap: 25px; margin-top: 15px; }
        .profile-sidebar { flex: 1; min-width: 240px; background: #fafbfc; border: 1px solid var(--border-color); padding: 15px; border-radius: 4px; max-height: 550px; overflow-y: auto; }
        .profile-main { flex: 2; min-width: 400px; background: white; border: 1px solid var(--border-color); padding: 20px; border-radius: 4px; }
        .pilot-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #edf2f7; font-size: 13px; color: #4a5568; }
        .pilot-item:hover { background: #edf2f7; color: var(--primary); border-radius: 3px; }
        .pilot-item.active { background: var(--primary); color: white; font-weight: 500; border-radius: 3px; }
        
        .svg-chart { width: 100%; height: 320px; background: #fafbfc; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 15px; }
        .legend { display: flex; gap: 20px; font-size: 12px; margin-top: 12px; align-items: center; color: var(--text-muted); }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 14px; height: 3px; display: inline-block; }

        .audit-card { background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-container">
            <h1 class="brand-title">Be F3F</h1>
            <p class="subtitle">Classement officiel &bull; Cote Elo &bull; Convergence Globale</p>
        </div>
        
        <!-- Menu Burger -->
        <div class="menu-container">
            <button class="hamburger-btn" onclick="toggleMenu(event)" title="Menu de navigation">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div id="dropdownMenu" class="dropdown-menu"></div>
        </div>
    </header>

    <div id="status" class="status-msg">Initialisation de l'application...</div>

    <div class="controls-bar" id="controlsBar" style="display:none;">
        <div class="controls-left">
            <label for="yearSelect"><b>Saison :</b></label>
            <select id="yearSelect" onchange="renderActiveSeason()"></select>
            <span id="loadedCount" style="color: var(--text-muted); font-size: 13px; margin-left: 10px;"></span>
        </div>
        <div class="controls-right">
            <button class="action-btn btn-excel" onclick="exportToExcelMultiSheet()">Exporter Excel</button>
            <button class="action-btn btn-primary" onclick="loadContestsAutomatically()">Actualiser</button>
        </div>
    </div>

    <div id="tabContentsContainer"></div>
</div>

<script>
    // Renseigne ici ton nom d'utilisateur GitHub et le nom de ton dépôt
    const GITHUB_OWNER = "ShooterF3x"; 
    const GITHUB_REPO = "be-f3f";  

    let rawContestsData = [];
    let currentSeasonRankings = [];
    let currentSeasonHistories = {};
    let activeContests = [];
    let menuItemsConfig = [];
    let activeTabId = 'tab-general';
    const MIN_CONTESTS_REQUIRED = 3;

    window.onload = function() {
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.menu-container')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        let savedData = localStorage.getItem('bef3f_data');
        if (savedData) {
            try {
                let parsed = JSON.parse(savedData);
                rawContestsData = parsed.map(c => ({
                    ...c,
                    date: new Date(c.date)
                }));
                if (rawContestsData.length > 0) {
                    rawContestsData.sort((a, b) => a.date.getTime() - b.date.getTime());
                    document.getElementById('status').innerText = `${rawContestsData.length} concours chargés depuis la mémoire.`;
                    populateYearSelector();
                    renderActiveSeason();
                    return; 
                }
            } catch(e) { console.error("Erreur mémoire locale", e); }
        }
        
        loadContestsAutomatically();
    };

    function toggleMenu(e) {
        e.stopPropagation();
        document.getElementById('dropdownMenu').classList.toggle('show');
    }

    async function loadContestsAutomatically() {
        document.getElementById('status').innerText = "Recherche des dossiers de saisons sur GitHub...";
        rawContestsData = [];

        if (GITHUB_OWNER && GITHUB_REPO) {
            try {
                // Scanne dynamiquement le dossier 'data' pour trouver toutes les années (ex: 2025, 2026...)
                const dataUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/data`;
                let resData = await fetch(dataUrl);
                if (resData.ok) {
                    let items = await resData.json();
                    let yearDirs = items.filter(item => item.type === 'dir');
                    
                    for (let yearDir of yearDirs) {
                        let yearRes = await fetch(yearDir.url);
                        if (yearRes.ok) {
                            let files = await yearRes.json();
                            let csvFiles = files.filter(f => f.name.endsWith('.csv'));
                            let promises = csvFiles.map(async (file) => {
                                let fRes = await fetch(file.download_url);
                                if (fRes.ok) {
                                    let text = await fRes.text();
                                    parseVaultCSV(text, file.name);
                                }
                            });
                            await Promise.all(promises);
                        }
                    }
                }
            } catch (err) {
                console.warn("Échec du chargement GitHub automatique :", err);
            }
        }

        if (rawContestsData.length > 0) {
            rawContestsData.sort((a, b) => a.date.getTime() - b.date.getTime());
            saveToLocalStorage();
            document.getElementById('status').innerText = `${rawContestsData.length} concours chargé(s) depuis GitHub.`;
            populateYearSelector();
            renderActiveSeason();
        } else {
            document.getElementById('status').innerText = "Aucun fichier CSV trouvé automatiquement sur GitHub. Utilisez l'import manuel ci-dessous.";
            renderEmptyAdminView();
        }
    }

    function handleFileSelect(event) {
        const files = event.target.files;
        if (files.length === 0) return;
        
        let filesProcessed = 0;
        document.getElementById('status').innerText = `Analyse de ${files.length} fichier(s)...`;

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                parseVaultCSV(e.target.result, file.name);
                filesProcessed++;
                if (filesProcessed === files.length) {
                    rawContestsData.sort((a, b) => a.date.getTime() - b.date.getTime());
                    saveToLocalStorage();
                    document.getElementById('status').innerText = `Fichiers importés avec succès.`;
                    populateYearSelector();
                    renderActiveSeason();
                }
            };
            reader.readAsText(file);
        });
    }

    function saveToLocalStorage() {
        localStorage.setItem('bef3f_data', JSON.stringify(rawContestsData));
    }

    function deleteContest(indexInRaw) {
        let contestName = rawContestsData[indexInRaw].name;
        if (confirm(`Supprimer le concours "${contestName}" de la mémoire ?`)) {
            rawContestsData.splice(indexInRaw, 1);
            saveToLocalStorage();
            if (rawContestsData.length === 0) {
                document.getElementById('controlsBar').style.display = 'none';
                renderEmptyAdminView();
            } else {
                populateYearSelector();
                renderActiveSeason();
            }
        }
    }

    function renderEmptyAdminView() {
        let contentsContainer = document.getElementById('tabContentsContainer');
        contentsContainer.innerHTML = '';
        document.getElementById('controlsBar').style.display = 'none';

        menuItemsConfig = [{ label: 'Administration', targetId: 'tab-manage', group: 'Général' }];
        buildDropdownMenu();

        let manageDiv = document.createElement('div');
        manageDiv.id = 'tab-manage';
        manageDiv.className = 'tab-content active';
        manageDiv.innerHTML = `
            <h2>Importer vos premiers concours</h2>
            <p style="font-size:13px; color:var(--text-muted);">Aucun concours trouvé automatiquement. Déposez vos fichiers F3X Vault CSV ci-dessous ou vérifiez vos identifiants GitHub dans le code.</p>
            <div class="upload-area" onclick="document.getElementById('csvFiles').click()">
                <h3>📁 Cliquez ou glissez vos fichiers CSV ici</h3>
                <input type="file" id="csvFiles" multiple accept=".csv" onchange="handleFileSelect(event)">
            </div>
        `;
        contentsContainer.appendChild(manageDiv);
    }

    function parseVaultCSV(text, fallbackName) {
        const lines = text.split(/\r?\n/);
        let contestName = fallbackName.replace('.csv', '');
        let nbRounds = 12;
        let contestDate = new Date();
        let pilotScores = {};
        let pilotDetails = [];
        let headerFound = false;
        let rawHeaders = [];
        let colIdx = { name: -1, percent: -1, points: -1 };

        lines.forEach(line => {
            if (!line.trim()) return;
            const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());

            if (cols[0] === "Event_Name" && cols[1]) contestName = cols[1];
            if (cols[0] === "Number_Rounds" && cols[1]) nbRounds = parseInt(cols[1]);
            if ((cols[0] === "End_Date" || cols[0] === "Start_Date") && cols[1]) {
                let parsedDate = new Date(cols[1]);
                if (!isNaN(parsedDate)) contestDate = parsedDate;
            }

            if (cols.includes("Pilot_Name") || cols.includes("Position")) {
                headerFound = true;
                rawHeaders = cols;
                colIdx.name = cols.findIndex(c => c === "Pilot_Name");
                colIdx.percent = cols.findIndex(c => c === "Percent");
                colIdx.points = cols.findIndex(c => c === "Total Points");
                return;
            }

            if (headerFound && colIdx.name > -1 && cols[colIdx.name]) {
                let pilotName = cols[colIdx.name].toUpperCase();
                let score = 0;
                if (colIdx.percent > -1 && !isNaN(parseFloat(cols[colIdx.percent]))) {
                    score = parseFloat(cols[colIdx.percent]) * 10;
                } else if (colIdx.points > -1 && !isNaN(parseFloat(cols[colIdx.points]))) {
                    score = parseFloat(cols[colIdx.points]);
                }

                if (pilotName && score > 0) {
                    pilotScores[pilotName] = score;
                    pilotDetails.push(cols);
                }
            }
        });

        if (Object.keys(pilotScores).length > 0) {
            rawContestsData = rawContestsData.filter(c => !(c.name === contestName && c.date.getTime() === contestDate.getTime()));
            rawContestsData.push({
                name: contestName,
                date: contestDate,
                year: contestDate.getFullYear(),
                rounds: nbRounds,
                scores: pilotScores,
                details: pilotDetails,
                headers: rawHeaders,
                idc: 1.0
            });
        }
    }

    function populateYearSelector() {
        let years = [...new Set(rawContestsData.map(c => c.year))].
